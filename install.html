<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安裝 Team Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#faf5ff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:24px;padding:32px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(139,92,246,.12);border:1px solid #e9d5ff}
.icon{font-size:64px;margin-bottom:16px}
h1{font-size:20px;color:#7c3aed;margin-bottom:8px}
.sub{color:#a78bfa;font-size:14px;margin-bottom:24px}
.steps{text-align:left;background:#faf5ff;border-radius:16px;padding:20px;margin-bottom:24px}
.step{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.num{background:linear-gradient(135deg,#c084fc,#e879f9);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex-shrink:0}
.step-text{font-size:14px;color:#4b5563;line-height:1.5}
.step-text b{color:#7c3aed}
.warn{background:#fef3c7;border-radius:12px;padding:12px 16px;font-size:12px;color:#92400e;margin-bottom:20px;line-height:1.5}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#a855f7,#c084fc);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97)}
.already{margin-top:16px;font-size:12px;color:#c4b5fd}
.share-icon{display:inline-block;background:#007aff;color:#fff;width:22px;height:22px;border-radius:5px;text-align:center;line-height:22px;font-size:14px;vertical-align:middle}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✨📱</div>
  <h1>安裝 Team Hub</h1>
  <div class="sub">加入主畫面，一撳即用！</div>

  <div class="warn">
    ⚠️ 請確保用 <b>Safari</b> 開啟此頁面<br>
    （WhatsApp / Chrome 內置瀏覽器唔得㗎）
  </div>

  <div class="steps">
    <div class="step">
      <div class="num">1</div>
      <div class="step-text">撳下面 <b>「打開 Team Hub」</b></div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div class="step-text">撳 Safari 底部嘅 <span class="share-icon">⬆</span> <b>分享按鈕</b></div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div class="step-text">向下碌，撳 <b>「加至主畫面」</b></div>
    </div>
    <div class="step">
      <div class="num">4</div>
      <div class="step-text">撳右上角 <b>「加入」</b> 就搞掂 🎉</div>
    </div>
  </div>

  <a class="btn" id="openBtn" href="#">打開 Team Hub →</a>

  <div class="already">已經安裝？直接喺主畫面打開就得啦 💜</div>
</div>

<script>
// ⬇️ 改成你嘅 Team Hub 實際網址
const HUB_URL = window.location.href.replace('install.html','index.html');

document.getElementById('openBtn').href = HUB_URL;

// 檢測係咪 Safari
const ua = navigator.userAgent;
const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|OPiOS|Chrome|Edg/.test(ua);
const isInApp = /FBAN|FBAV|Instagram|Line|WeChat|MicroMessenger|WhatsApp/.test(ua);

if(isInApp){
  document.querySelector('.warn').innerHTML = '🚨 <b>你而家用緊 App 內置瀏覽器！</b><br>請撳右上角 <b>「⋯」</b> → <b>「用 Safari 打開」</b>';
  document.querySelector('.warn').style.background = '#fee2e2';
  document.querySelector('.warn').style.color = '#991b1b';
}
</script>
</body>
</html>
